version: '3.8'

services:
  # ============================================================================
  # BACKEND SERVICE (Express.js API) — Port Host 3005
  # ============================================================================
  gamification-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gamification-backend
    restart: unless-stopped
    ports:
      - "3005:3005"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ./backend/.env
    environment:
      PORT: ${PORT:-3005}
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-localhost}
      MINIO_PORT: ${MINIO_PORT:-9000}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-gamification}
    volumes:
      - gamification_backend_uploads:/app/uploads

  # ============================================================================
  # FRONTEND SERVICE (Nuxt 3 SPA via Nginx) — Port Host 3006
  # ============================================================================
  gamification-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-http://103.168.147.133:3005/api}
    container_name: gamification-frontend
    restart: unless-stopped
    ports:
      - "3006:80"
    depends_on:
      - gamification-backend

volumes:
  gamification_backend_uploads:
