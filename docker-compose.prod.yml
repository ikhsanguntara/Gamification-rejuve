services:

  # ==========================================================
  # POSTGRESQL
  # ==========================================================
  gamification-db:
    image: postgres:16-alpine
    container_name: gamification-db
    restart: unless-stopped

    ports:
    - "127.0.0.1:5434:5432"

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - gamification_db_data:/var/lib/postgresql/data

    networks:
      - gamification-network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10


  # ==========================================================
  # MINIO - REJUVE SHARED OBJECT STORAGE
  # Internal only:
  # - API     : 9000
  # - Console : 9001
  # ==========================================================
  rejuve-minio:
    image: quay.io/minio/minio:latest
    container_name: rejuve-minio
    restart: unless-stopped

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}

    volumes:
      - rejuve_minio_data:/data

    networks:
      - gamification-network


  # ==========================================================
  # BACKEND
  #
  # Host EC2 :84
  #      ↓
  # Container :3005
  # ==========================================================
  gamification-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: gamification-backend
    restart: unless-stopped

    ports:
      - "84:3005"

    mem_limit: 256m
    mem_reservation: 100m

    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 100M

    environment:
      TZ: Asia/Jakarta
      PORT: 3005
      NODE_ENV: production

      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@gamification-db:5432/${POSTGRES_DB}

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      CORS_ORIGIN: ${CORS_ORIGIN}

      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PORT: ${MINIO_PORT}
      MINIO_USE_SSL: ${MINIO_USE_SSL}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}

      LYNX_API_URL: ${LYNX_API_URL}
      LYNX_API_TOKEN: ${LYNX_API_TOKEN}
  
    networks:
      - gamification-network

    depends_on:
      gamification-db:
        condition: service_healthy

      rejuve-minio:
        condition: service_started

    volumes:
      - gamification_backend_uploads:/app/uploads



  # ==========================================================
  # FRONTEND
  #
  # Host EC2 :82
  #      ↓
  # Container Nginx :80
  # ==========================================================
  gamification-frontend:
    image: ${FRONTEND_IMAGE:-rejuve-gamification-frontend:v1.0.1}

    container_name: gamification-frontend
    restart: unless-stopped

    ports:
      - "82:80"

    mem_limit: 128m
    mem_reservation: 32m

    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M

    networks:
      - gamification-network

    depends_on:
      - gamification-backend


# ==========================================================
# NETWORK
# ==========================================================
networks:
  gamification-network:
    name: gamification-network
    driver: bridge


# ==========================================================
# PERSISTENT VOLUMES
# ==========================================================
volumes:

  gamification_db_data:
    name: gamification_db_data

  gamification_backend_uploads:
    name: gamification_backend_uploads

  rejuve_minio_data:
    name: rejuve_minio_data