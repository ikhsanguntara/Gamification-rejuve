version: '3.8'

services:

  # ==========================================================
  # POSTGRESQL
  # ==========================================================
  gamification-db:
    image: postgres:16-alpine
    container_name: gamification-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - gamification_db_data:/var/lib/postgresql/data

    networks:
      - gamification-network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10


  # ==========================================================
  # BACKEND
  #
  # Host EC2 :84
  #      ↓
  # Container :3005
  # ==========================================================
  gamification-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: gamification-backend
    restart: unless-stopped

    ports:
      - "84:3005"

    environment:
      PORT: 3005
      NODE_ENV: production

      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@gamification-db:5432/${POSTGRES_DB}

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      CORS_ORIGIN: ${CORS_ORIGIN}

      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PORT: ${MINIO_PORT}
      MINIO_USE_SSL: ${MINIO_USE_SSL}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}

    networks:
      - gamification-network

    depends_on:
      gamification-db:
        condition: service_healthy

    volumes:
      - gamification_backend_uploads:/app/uploads


  # ==========================================================
  # FRONTEND
  #
  # Host EC2 :82
  #      ↓
  # Container Nginx :80
  # ==========================================================
  gamification-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE}

    container_name: gamification-frontend
    restart: unless-stopped

    ports:
      - "82:80"

    networks:
      - gamification-network

    depends_on:
      - gamification-backend


networks:
  gamification-network:
    name: gamification-network
    driver: bridge


volumes:
  gamification_db_data:
    name: gamification_db_data

  gamification_backend_uploads:
    name: gamification_backend_uploads